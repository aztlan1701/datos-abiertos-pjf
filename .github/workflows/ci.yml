name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run catalogo:validar
      - run: npm run catalogo:importar -- --entrada docs/fuentes/Estructura_de_carga_PDA-2.xlsx --salida /tmp/catalogo.csv
      - run: npm run catalogo:validar -- --entrada ejemplos/catalogo.csv
      - run: npm run matriz -- --entrada ejemplos/compromisos.csv --catalogo ejemplos/catalogo.csv --corte 2026-11-13
